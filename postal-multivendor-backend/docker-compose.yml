version: '3.8'

services:
  mongodb:
    image: mongo:6
    container_name: postal-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
      MONGO_INITDB_DATABASE: postal-multivendor
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - postal-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: postal-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    environment:
      NODE_ENV: production
      PORT: 8001
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/postal-multivendor?authSource=admin
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in the environment}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in the environment}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001}
    ports:
      - "8001:8001"
    volumes:
      - ./uploads:/app/uploads
    networks:
      - postal-network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:8001/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  mongodb_data:
    driver: local

networks:
  postal-network:
    driver: bridge
